name: Security scan

# Deep dependency vulnerability scan of the whole tree, kept out of ci.yml because it is slow and
# its findings change without the code changing — a scan that turns a PR red because a new CVE was
# published overnight trains people to ignore red. Weekly, plus on demand.
on:
  schedule:
    # Mondays, 04:17 UTC. Off the hour on purpose: the top of the hour is when every scheduled
    # workflow on GitHub queues at once.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp-dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: maven

      # NVD started rate-limiting anonymous API access hard enough that an unauthenticated full
      # feed download takes hours and usually times out. Rather than hand back a job that is red
      # for an infrastructure reason, report the missing key honestly and stop.
      #
      # To enable: request a key at https://nvd.nist.gov/developers/request-an-api-key and add it
      # as the repository secret NVD_API_KEY.
      - name: Check for an NVD API key
        id: nvd
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIPPED, not passed — no NVD_API_KEY secret is configured, so the NVD feed cannot be downloaded. See the step comment for how to add one."
          fi
        shell: bash

      # The NVD data cache is the expensive part (hundreds of MB). Keyed by week so it refreshes
      # every scheduled run but is reused by manual dispatches in between.
      - name: Cache the NVD database
        if: steps.nvd.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: Build the reactor
        if: steps.nvd.outputs.present == 'true'
        run: ./mvnw -B -DskipTests -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true install
        shell: bash

      # CVSS 7 = high. Anything at or above that fails the scan; lower findings land in the report
      # artifact for triage without blocking.
      - name: Run OWASP dependency-check
        if: steps.nvd.outputs.present == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -Psecurity-scan dependency-check:aggregate
        shell: bash

      - name: Upload the report
        if: always() && steps.nvd.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report the outcome
        if: steps.nvd.outputs.present == 'false'
        run: |
          echo "### OWASP dependency-check: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No \`NVD_API_KEY\` repository secret is configured, so no scan ran." >> "$GITHUB_STEP_SUMMARY"
          echo "This is **not** a passing scan — nothing was checked." >> "$GITHUB_STEP_SUMMARY"
        shell: bash
