name: Generate Demo GIF

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main/java/**'
      - 'blindbean-example/src/main/java/**'
      - 'tools/demo-commands.sh'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

# Read-only by default. The write scopes the GIF PR needs are granted to that one job below, so a
# step added to this file later does not inherit them (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  generate-demo:
    name: Record demo and convert to GIF
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the chore/update-demo-gif-* branch
      pull-requests: write   # open the PR for it

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 26
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: maven

      - name: Install asciinema
        run: sudo apt-get install -y asciinema

      # Pinned version and checksum, not releases/latest: an unpinned binary download runs whatever
      # was uploaded last, with this job's write token in reach.
      - name: Install agg
        env:
          AGG_VERSION: v1.9.0
          AGG_SHA256: f111e315cd71056b116302342553dd765b7297579ed511f111d0cedb442aeda6
        run: |
          curl -fsSL "https://github.com/asciinema/agg/releases/download/${AGG_VERSION}/agg-x86_64-unknown-linux-gnu" \
            -o /tmp/agg
          echo "${AGG_SHA256}  /tmp/agg" | sha256sum --check --strict
          sudo install -m 0755 /tmp/agg /usr/local/bin/agg

      - name: Build BlindBean core library & install
        run: |
          ./mvnw clean install -DskipTests

      - name: Reset example placeholder files
        working-directory: blindbean-example
        run: |
          : > CLAUDE.md
          : > GEMINI.md

      - name: Record demo session
        working-directory: blindbean-example
        env:
          # asciinema needs a home dir for config
          HOME: /root
        run: |
          chmod +x ../tools/demo-commands.sh
          asciinema rec ../docs/blindbean-demo.cast \
            --command "bash ../tools/demo-commands.sh" \
            --cols 80 --rows 24 \
            --overwrite

      - name: Convert cast to GIF
        run: |
          agg docs/blindbean-demo.cast docs/demo.gif \
            --font-size 14 \
            --speed 1.2 \
            --idle-time-limit 3

      - name: Commit GIF via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif docs/blindbean-demo.cast
          if git diff --staged --quiet; then
            echo "GIF unchanged — nothing to commit."
            exit 0
          fi
          BRANCH="chore/update-demo-gif-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "chore: regenerate demo GIF"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: regenerate demo GIF" \
            --body "Auto-generated by the [demo workflow](../actions/workflows/demo.yml). Merges the updated \`docs/demo.gif\` and \`docs/blindbean-demo.cast\`." \
            --label "documentation" || true
