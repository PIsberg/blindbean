name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Java gate: every supported JDK on every supported OS ──────────────────────────────────────
  #
  # The matrix is the point. BlindBean compiles at `${maven.compiler.release}` (26 by default), and
  # each leg overrides it to its own JDK, so the sources are checked against *that* JDK's API
  # rather than merely re-verified on the one they were written against.
  #
  # 25 and 26 only. The floor is JDK 22, not 21: java.lang.foreign (Arena, MemorySegment,
  # ValueLayout, used throughout blindbean-fhe) was a preview API in 21, and Arena.allocateFrom did
  # not exist there at all. A 21 leg would not fail on a flag, it would fail to compile.
  java-gate:
    name: Java gate (JDK ${{ matrix.java }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [ '25', '26' ]
        include:
          # 26 is still EA and Oracle is the distribution publishing it. 25 is GA, so it comes from
          # Temurin, which keeps non-LTS GA builds available after the next EA opens.
          - java: '25'
            distribution: 'temurin'
          - java: '26'
            distribution: 'oracle'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          cache: maven

      # Build every module and run everything that does not need the native library — the annotation
      # processor, Paillier, the key stamp, contexts, rotation, the JUnit extension. The reactor
      # resolves modules internally, so no install step is needed; the tests all live in
      # blindbean-tests, which is where the JaCoCo report lands.
      #
      # `verify` (not `test`) so the static-analysis gates bound to that phase — Checkstyle, PMD and
      # SpotBugs — run here too; none of them needs the native library, and the ArchUnit boundary
      # tests run in the normal test phase. A violation fails the gate exactly like a test failure.
      - name: Build, analyse (checkstyle/pmd/spotbugs) + run the non-native test suite
        run: ./mvnw -B verify -DexcludedGroups=native -Dmaven.compiler.release=${{ matrix.java }}
        shell: bash

      # One upload, not six. Codecov merges by report name, and six near-identical reports from the
      # same gate add no coverage while making a genuinely missing upload harder to spot.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.java == '26'
        uses: codecov/codecov-action@v7
        with:
          files: ./blindbean-tests/target/site/jacoco/jacoco.xml
          name: java-fast-gate
          fail_ci_if_error: false

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-java-gate-${{ matrix.os }}-jdk${{ matrix.java }}
          path: blindbean-tests/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ── Javadoc ───────────────────────────────────────────────────────────────────────────────────
  #
  # The release profile attaches a javadoc jar, so a javadoc error is release-blocking and would
  # otherwise only surface at tag time, after the version is already fixed. This runs the same
  # plugin on every PR instead.
  #
  # NOTE: doclint is `none` in pom.xml, so this catches javadoc *errors* (unresolvable @link
  # targets, malformed HTML that aborts generation), not missing-@param warnings. Turning doclint
  # on is a separate change with its own backlog.
  javadoc:
    name: Javadoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: maven

      # A bare `javadoc:jar` would resolve the sibling modules from the repository rather than the
      # working tree, so an API change in one module would be documented against the *last
      # published* version of the next. Run a lifecycle phase first.
      - name: Build the reactor
        run: ./mvnw -B -DskipTests -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true install
        shell: bash

      - name: Generate javadoc (release profile)
        run: ./mvnw -B -Prelease -DskipTests -Dgpg.skip=true javadoc:jar
        shell: bash

      - name: Upload javadoc
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javadoc
          path: '**/target/*-javadoc.jar'
          if-no-files-found: ignore
          retention-days: 14

  # ── Reproducible build ────────────────────────────────────────────────────────────────────────
  #
  # Builds the reactor twice from identical source and compares the jars byte for byte. This is what
  # `project.build.outputTimestamp` in pom.xml buys: without it, jar entry timestamps come from the
  # clock, every build differs, and nobody downstream can verify that a published jar was really
  # built from the tagged source.
  #
  # `artifact:check-buildplan` is the cheap half — it fails when the build uses a plugin version
  # known not to produce reproducible output, which is the usual way this regresses.
  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: maven

      - name: Check the build plan supports reproducibility
        run: ./mvnw -B artifact:check-buildplan
        shell: bash

      - name: First build
        run: |
          ./mvnw -B -DskipTests -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true clean package
          find . -name '*.jar' -path '*/target/*' | sort > /tmp/jars.txt
          test -s /tmp/jars.txt || { echo "::error::no jars produced — the comparison would pass vacuously"; exit 1; }
          xargs sha256sum < /tmp/jars.txt > /tmp/sums-1.txt
          cat /tmp/sums-1.txt
        shell: bash

      - name: Second build
        run: |
          ./mvnw -B -DskipTests -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true clean package
          xargs sha256sum < /tmp/jars.txt > /tmp/sums-2.txt
        shell: bash

      # diff, not a count: two builds producing the same *number* of differing jars is exactly the
      # failure this job exists to catch.
      - name: Compare the two builds
        run: |
          if diff -u /tmp/sums-1.txt /tmp/sums-2.txt; then
            echo "Reproducible: every jar is byte-identical across two clean builds."
          else
            echo "::error::Build is not reproducible — the jars above differ between two builds of identical source."
            exit 1
          fi
        shell: bash

  # ── Dependency hygiene ────────────────────────────────────────────────────────────────────────
  #
  # Two cheap, different questions:
  #   enforcer            — is the *build* well-formed? (Maven/JDK floor, duplicate declarations)
  #   dependency:analyze  — is the *dependency list* honest? (compiled against something undeclared,
  #                         or declaring something never used)
  #
  # The second matters more here than in a typical library: `processor` must depend only on
  # `annotations`, and a used-undeclared dependency is precisely how that invariant rots without
  # anyone knowingly editing a pom.
  dependency-hygiene:
    name: Dependency hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: maven

      - name: Enforcer rules
        run: ./mvnw -B enforcer:enforce
        shell: bash

      - name: Build the reactor
        run: ./mvnw -B -DskipTests -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true install
        shell: bash

      # analyze-only, not analyze: the latter forks a fresh test-compile and would rebuild the whole
      # reactor a second time. The classes are already there from the step above.
      #
      # REPORT, NOT A GATE. `-DfailOnWarning=true` is deliberately absent: the tree currently has
      # four real used-undeclared findings (blindbean-fhe, -runtime and -junit compile against
      # blindbean-annotations, and -runtime against blindbean-core, but all reach them
      # transitively), plus compile-scoped test-only dependencies in blindbean-tests. Declaring
      # those properly is a dependency change with its own review, not something to smuggle into a
      # CI PR. Read the warnings in the log; turn on failOnWarning once they are zero.
      #
      # The false positives the analyser cannot avoid — SOURCE-retention annotations, aggregator
      # artifacts — are already filtered by ignore lists in pom.xml, so what remains is real.
      - name: Analyse declared vs used dependencies (report)
        run: ./mvnw -B dependency:analyze-only
        shell: bash

  # ── Dependency review (PRs only) ──────────────────────────────────────────────────────────────
  #
  # Fails a PR that introduces a dependency carrying a known advisory. Needs no API key and looks
  # only at the PR diff, so it is fast; the full-tree scan lives in security-scan.yml.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── Native library, all three platforms ───────────────────────────────────────────────────────
  #
  # Untouched by the JDK matrix: the SEAL bridge is C++ and knows nothing about the JVM version.
  native-build-matrix:
    name: Native build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: java-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            vcpkg_triplet: x64-linux
            library_path: build-native/blindbean_fhe.so
            artifact_name: blindbean_fhe-linux-x64
            cmake_generator_args: ""
          - os: macos-latest
            label: macos-arm64
            vcpkg_triplet: arm64-osx
            library_path: build-native/blindbean_fhe.dylib
            artifact_name: blindbean_fhe-macos-arm64
            cmake_generator_args: ""
          - os: windows-latest
            label: windows-x64
            vcpkg_triplet: x64-windows-static
            library_path: build-native/Release/blindbean_fhe.dll
            artifact_name: blindbean_fhe-windows-x64
            cmake_generator_args: "-A x64"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 'b5229343b4b80264ed51e89c6a7dcd0cbe85e9cc'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          runVcpkgInstall: false

      - name: Configure Native Build (CMake + SEAL)
        id: cmake_config
        run: |
          cmake -S blindbean-fhe/src/main/native -B build-native \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            ${{ matrix.cmake_generator_args }}
        shell: bash

      - name: Show vcpkg Error Log on Failure
        if: failure() && steps.cmake_config.outcome == 'failure'
        run: |
          if [ -f build-native/vcpkg-manifest-install.log ]; then
            cat build-native/vcpkg-manifest-install.log
          fi
        shell: bash

      - name: Build Native Library
        run: cmake --build build-native --config Release
        shell: bash

      - name: Verify native library exists
        run: |
          test -f "${{ matrix.library_path }}"
          ls -lh "${{ matrix.library_path }}"
        shell: bash

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.library_path }}
          if-no-files-found: error
          retention-days: 30

  native-sanitizers:
    name: Native ASan/UBSan (linux-x64)
    runs-on: ubuntu-latest
    needs: java-gate
    timeout-minutes: 45

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: maven

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: 'b5229343b4b80264ed51e89c6a7dcd0cbe85e9cc'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          runVcpkgInstall: false

      # Build the bridge with ASan + UBSan. SEAL comes from vcpkg uninstrumented; the sanitizer
      # interceptors are global so heap errors crossing into it are still caught, while UBSan
      # instruments our own translation units.
      - name: Configure + build sanitized native library
        id: cmake_config
        run: |
          cmake -S blindbean-fhe/src/main/native -B build-native \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DBLINDBEAN_SANITIZE=ON
          cmake --build build-native
        shell: bash

      - name: Show vcpkg Error Log on Failure
        if: failure() && steps.cmake_config.outcome == 'failure'
        run: |
          if [ -f build-native/vcpkg-manifest-install.log ]; then
            cat build-native/vcpkg-manifest-install.log
          fi
        shell: bash

      - name: Verify the library is instrumented
        run: |
          test -f build-native/blindbean_fhe.so
          echo "ASan runtime linkage:"
          ldd build-native/blindbean_fhe.so | grep -i asan || echo "  (asan linked statically or via interceptors)"
        shell: bash

      # Build + install the modules without sanitizers (normal JVM, fast), so the sanitizer run
      # only has to execute the native tests.
      - name: Build + install modules (no sanitizer)
        run: ./mvnw -B -DskipTests -Dcheckstyle.skip=true -Dpmd.skip=true -Dspotbugs.skip=true install
        shell: bash

      # Run only the @Tag("native") tests against the sanitized .so. The JVM is not instrumented, so
      # LD_PRELOAD pulls in the ASan runtime before the JVM allocates. handle_segv=0 is essential:
      # the JVM raises SIGSEGV for implicit null checks and safepoint polling, which ASan must not
      # intercept. LeakSanitizer is off (detect_leaks=0) because a live JVM legitimately holds many
      # allocations it would report as leaks; this job targets use-after-free / double-free / heap
      # overflow / UB at the FFM boundary. abort_on_error makes any finding fail the job.
      - name: Run native tests under ASan + UBSan
        run: |
          ASAN_RT="$(gcc -print-file-name=libasan.so)"
          CXX_RT="$(g++ -print-file-name=libstdc++.so.6)"
          echo "Preloading ASan runtime + libstdc++: $ASAN_RT : $CXX_RT"
          # Preload libstdc++ alongside libasan so ASan resolves the real __cxa_throw at init time.
          # SEAL throws C++ exceptions on invalid-parameter paths; without this the interceptor hits
          # CHECK(REAL(__cxa_throw)) and aborts as the exception unwinds. Fake-stack
          # (detect_stack_use_after_return) is off too — it interacts badly with unwinding through
          # the uninstrumented JVM frames. Heap use-after-free / double-free / overflow stay on.
          LD_PRELOAD="$ASAN_RT:$CXX_RT" \
          ASAN_OPTIONS="detect_leaks=0:handle_segv=0:handle_sigbus=0:handle_sigfpe=0:abort_on_error=1:halt_on_error=1:detect_stack_use_after_return=0:strict_string_checks=1:symbolize=1" \
          UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1" \
          ./mvnw -B -pl blindbean-tests test \
            -Dgroups=native \
            -Dblindbean.native.path="$GITHUB_WORKSPACE/build-native"
        shell: bash

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-surefire-reports
          path: blindbean-tests/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ── Full suite, native tests included, on both supported JDKs ─────────────────────────────────
  #
  # The only job that runs the BFV/CKKS tests, the module-path consumer and the example, so also the
  # only place "BlindBean *works* on JDK 25" is demonstrated rather than merely compiled. Windows,
  # because that is the platform whose DLL artifact is published above.
  full-windows:
    name: Full Windows test (JDK ${{ matrix.java }})
    runs-on: windows-latest
    needs: native-build-matrix
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: [ '25', '26' ]
        include:
          - java: '25'
            distribution: 'temurin'
          - java: '26'
            distribution: 'oracle'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          cache: maven

      - name: Download Windows native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blindbean_fhe-windows-x64
          path: build-native/Release

      - name: Verify downloaded DLL exists
        run: |
          if (!(Test-Path "build-native/Release/blindbean_fhe.dll")) {
            Write-Error "DLL not found after artifact download."
            exit 1
          }
          Write-Host "DLL size: $((Get-Item build-native/Release/blindbean_fhe.dll).Length) bytes"
        shell: pwsh

      # Reactor build: compiles all modules, runs the full test suite (incl. native), and installs
      # each module to the local repo so the standalone example / load-tests / module-path checks
      # can resolve them.
      #
      # No -Dblindbean.native.path here on purpose: surefire forks with the blindbean-tests module
      # as its cwd, so a RELATIVE path would resolve under that module, not the repo root. The
      # blindbean-tests pom defaults it to ${project.basedir}/../build-native/Release, which points
      # at the DLL the download step placed at the repo root.
      - name: Build + test all modules
        run: .\mvnw.cmd clean install -B "-Dmaven.compiler.release=${{ matrix.java }}"
        shell: pwsh

      # The crown jewel of the split: a consumer on the MODULE path, in its own JVM, resolving the
      # split modules, discovering the processor on the --processor-module-path, and calling native
      # FFM from the named fhe module. This is the check that fails if a module-info export is wrong.
      - name: Module-path consumer test
        run: ..\mvnw.cmd clean test -B "-Dblindbean.native.path=../build-native/Release" "-Dmaven.compiler.release=${{ matrix.java }}"
        shell: pwsh
        working-directory: module-path-tests

      - name: Build and Test Example Application
        run: ..\mvnw.cmd clean test -B "-Dblindbean.native.path=../build-native/Release" "-Dmaven.compiler.release=${{ matrix.java }}"
        shell: pwsh
        working-directory: blindbean-example

      # A small-load regression gate, not a benchmark. The assertions are the point: BFV must keep
      # its multiplicative depth (>= 4), batched expansion must stay in single digits, and no thread
      # may read back a value it did not write. Numbers on a shared runner are noise — the gates are
      # deliberately loose so they catch a broken batch path, not a busy CI box.
      #
      # -Dstress.max.ops caps the two loops that dominate the runtime; the full sweep (the figures
      # in load-tests/results/) is a local/release run. ~10s here vs ~2min at full load.
      - name: Load-test regression gate (small load)
        run: ..\mvnw.cmd clean test -B "-Dblindbean.native.path=../build-native/Release" "-Dstress.max.ops=50" "-Dmaven.compiler.release=${{ matrix.java }}"
        shell: pwsh
        working-directory: load-tests

      - name: Upload load-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-test-reports-jdk${{ matrix.java }}
          path: load-tests/target/*.txt
          if-no-files-found: ignore
          retention-days: 14

      # The FHE bridge can *only* be covered here — it needs the DLL. If this upload breaks,
      # FheContext/FheCiphertextNative read 0% in Codecov on code that is in fact well tested.
      # From the 26 leg only, so the two legs cannot race to overwrite the same report.
      - name: Upload coverage to Codecov
        if: matrix.java == '26'
        uses: codecov/codecov-action@v7
        with:
          files: ./blindbean-tests/target/site/jacoco/jacoco.xml,./blindbean-example/target/site/jacoco/jacoco.xml
          name: full-windows
          fail_ci_if_error: false

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports-windows-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/
            blindbean-tests/target/surefire-reports/
